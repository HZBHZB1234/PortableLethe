[package]
name = "portable-lethe-hub"
version = "0.1.0"
description = "Portable Lethe Hub - Tauri 2 desktop control center (pure Rust core)"
authors = ["PortableLethe"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "portable_lethe_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
crc32fast = "1"
rust-ini = "0.21"
twox-hash = "1.6"
unityfs = "0.1.4"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }

# NOTE: the design doc also lists `zip`, `git2` and `reflink`. This build
# environment has no crates.io access, so they are not resolved here.
# Pure-Rust equivalents: core/zipfile.rs (flate2), core/storage.rs
# (hardlink + copy), version.rs (HTTP release download). On a networked
# machine add the crates and map the empty feature flags below to dep:*.
[features]
default = []
zip-crate = []
git2-crate = []
reflink-crate = []
all-toolchains = ["zip-crate", "git2-crate", "reflink-crate"]

# Offline-environment workaround: empty placeholders for wasm32-only transitive
# crates whose archives are not cached (see patches/README.md).
[patch.crates-io]
cc = { path = "../patches/cc" }
wasm-bindgen = { path = "../patches/wasm-bindgen" }
js-sys = { path = "../patches/js-sys" }
web-sys = { path = "../patches/web-sys" }
wasm-bindgen-futures = { path = "../patches/wasm-bindgen-futures" }
wasm-streams = { path = "../patches/wasm-streams" }
